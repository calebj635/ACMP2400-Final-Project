name: 'Terraformer'
description: 'Executes terraform plan and apply steps'
author: 'calebj635'
inputs:
  ARM_CLIENT_ID:
    description: 'The Azure Client ID'
    required: true
  ARM_SUBRSCRIPTION_ID:
    description: 'The Azure Subscription ID'
    required: true
  ARM_TENANT_ID:
    description: 'The Azure Tenant ID'
    required: true
  STATE_KEY:
    description: 'The unique key for state lookup'
    required: true
  TF_STAGE:
    description: 'The Terraform Deployment Stage'
    required: true
runs:
  using: 'docker'
  image: 'Dockerfile'
